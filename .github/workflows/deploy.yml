name: Build & Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

      - name: Deploy to server
        env:
          SERVER_HOST: 185.253.219.225
          SERVER_USER: root
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          sudo apt-get install -y sshpass rsync
          sshpass -p "$SERVER_PASS" rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            frontend/.next/ \
            $SERVER_USER@$SERVER_HOST:/var/www/gymcrm/frontend/.next/
          sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no \
            $SERVER_USER@$SERVER_HOST \
            "pm2 restart gymcrm-frontend && echo 'Deployed!'"
